<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f8b6d">
<title>{{TITLE}}</title>
<!-- Page servie par server.js (renderIndex) : {{ROOT}} = chemin de montage de l'app
     (ex. /mylittlelibrary dans la passerelle), CONFIG = bibliotheque courante. La
     meme page sert l'accueil (/) et chaque bibliotheque (/<adresse>/). -->
<link rel="manifest" href="{{MANIFEST}}">
<link rel="icon" href="{{ROOT}}/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ROOT}}/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="{{TITLE}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="{{ROOT}}/style.css?v={{VERSION}}">
<script>window.MLL = {{CONFIG}};</script>
</head>
<body>
<header class="topbar no-print">
  <button class="menu-btn" id="menu-btn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="nav">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <a class="brand" href="#/">
    <img class="brand-logo" id="brand-logo" alt="" hidden>
    <span class="brand-name" id="brand-name">Bibliothèque</span>
  </a>
  <button class="btn btn-icon scan-btn" id="scan-btn" type="button" title="Scanner une étiquette" hidden>
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg>
    <span>Scanner</span>
  </button>
  <button class="btn btn-small install-btn" id="install-btn" type="button" title="Installer l'application sur cet appareil" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
    <span>Installer</span>
  </button>
  <div class="account" id="account"></div>
  <nav class="nav" id="nav"></nav>
</header>
<main class="shell" id="view"></main>
<div class="toasts no-print" id="toasts" aria-live="polite"></div>
<script src="{{ROOT}}/app.js?v={{VERSION}}"></script>
</body>
</html>
